name: Map size vs memory limit test
on:
  push:
    branches: [mapsize-test]
permissions:
  contents: read
jobs:
  cert:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "main defaults, limit 192Mi"
            cnf_config: .github/cnti/cnti-limit-192Mi.yaml
          - name: "main defaults, limit 256Mi"
            cnf_config: .github/cnti/cnti-limit-256Mi.yaml
          - name: "main defaults, limit 384Mi"
            cnf_config: .github/cnti/cnti-limit-384Mi.yaml
          - name: "main defaults, limit 512Mi"
            cnf_config: .github/cnti/cnti-limit-512Mi.yaml
          - name: "main, UPF_MAX_SESSIONS=1024, limit 128Mi"
            cnf_config: .github/cnti/cnti-sessions.yaml
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the image from main
        run: docker build -t ghcr.io/edgecomllc/eupf:main-test .
      - uses: lfn-cnti/testsuite-action@70536fda55fcb11f4f7463175fe9d57c86b85574 # v1.2.0
        with:
          version: v2.3.0
          cnf_config: ${{ matrix.cnf_config }}
          kind_config: .github/cnti/kind.yaml
          kind_load_images: ghcr.io/edgecomllc/eupf:main-test
          tests: cert
          log_level: info
          install_timeout: "300"
      - name: Memory as the kubelet accounts it
        if: always()
        run: |
          set +e
          kubectl get pods -n eupf -o wide
          pod=$(kubectl get pod -n eupf -l app.kubernetes.io/name=eupf -o jsonpath='{.items[0].metadata.name}')
          node=$(kubectl get pod -n eupf "$pod" -o jsonpath='{.spec.nodeName}')
          kubectl get --raw "/api/v1/nodes/$node/proxy/stats/summary" | jq -c --arg p "$pod" '.pods[]|select(.podRef.name==$p)|{pod: .podRef.name, pod_memory: .memory, containers: [.containers[]|{name, usageBytes: .memory.usageBytes, workingSetBytes: .memory.workingSetBytes, rssBytes: .memory.rssBytes}]}'
          kubectl get pod -n eupf "$pod" -o jsonpath='{.status.containerStatuses[0].restartCount} restarts, last state: {.status.containerStatuses[0].lastState}'; echo
          kubectl logs -n eupf "$pod" --tail=60 | grep -E "Apply eUPF|FTL|ERR" | cut -c1-300
