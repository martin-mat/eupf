# Demo fork of eUPF's CNTi job (martin-mat/eupf, branch cnti-demo): the
# CNTi Test Suite's essential tests on a kind cluster, the CNTi essential
# badge, and the action's opt-in AI analysis of the failed tests that are not
# in the expected results. https://github.com/lfn-cnti/testsuite-action
name: CNTi essential

on:
  # By hand, and on pull requests that change the job, its configuration or
  # the chart.
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cnti.yml
      - .github/cnti/**
      - .deploy/helm/eupf/**

permissions:
  contents: read

jobs:
  # Runs of the default branch: the only runs that publish the badge, and the
  # only ones with a write token.
  essential:
    if: github.repository == 'martin-mat/eupf' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Publishes the badge to the orphan branch `badges`.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lfn-cnti/testsuite-action@caec9b0ba82b0f82e11e08eaed2cf5c1aa00dce4 # v1.3.0
        with:
          version: v2.4.0
          cnf_config: .github/cnti/cnti-testsuite.yaml
          kind_config: .github/cnti/kind.yaml
          tests: cert
          badge_branch: badges
          # The failures eUPF knows and accepts: only a test that differs from
          # this list is reported, and sent to the AI analysis.
          expected_results: .github/cnti/expected.yaml
          analyze: true
          analyze_provider: anthropic
          analyze_model: claude-opus-5-5
          analyze_api_key: ${{ secrets.CNTI_ANALYZE_KEY }}

  # Pull requests that change the job, its configuration or the chart: the same
  # run with a read-only token. A test that newly fails fails the check, and
  # the AI analysis of it is posted on the pull request. The action publishes
  # the badge only from the default branch.
  essential-pr:
    if: github.repository == 'martin-mat/eupf' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Posts the AI analysis as a comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trial of the suite's v2.4.1 candidate (lfn-cnti/testsuite main at
      # 84468ab4): built here as its release workflow builds it, and served to
      # the action from this runner, so no binary is published.
      - name: Check out the suite's v2.4.1 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfn-cnti/testsuite
          ref: 84468ab4c6b6ebd410bc534c72101e81fadd07c8
          path: suite-src
          fetch-depth: 0
          persist-credentials: false
      - name: Build it (static, as the release workflow does)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/suite-src:/workspace" -w /workspace crystallang/crystal:1.19.1-alpine-build sh -c "\
            git config --global --add safe.directory /workspace && shards install && \
            crystal build src/cnti-testsuite.cr --release --static --link-flags '-lxml2 -llzma'"
          mkdir -p "$RUNNER_TEMP/rc"
          tar -czf "$RUNNER_TEMP/rc/cnti-testsuite-v2.4.1-rc1.tar.gz" -C suite-src ./cnti-testsuite
          (cd "$RUNNER_TEMP/rc" && nohup python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &)
          for _ in $(seq 20); do curl -sf -o /dev/null http://127.0.0.1:8765/cnti-testsuite-v2.4.1-rc1.tar.gz && break || sleep 0.5; done

      - uses: lfn-cnti/testsuite-action@caec9b0ba82b0f82e11e08eaed2cf5c1aa00dce4 # v1.3.0
        with:
          binary_url: http://127.0.0.1:8765/cnti-testsuite-v2.4.1-rc1.tar.gz
          cnf_config: .github/cnti/cnti-testsuite.yaml
          kind_config: .github/cnti/kind.yaml
          tests: cert
          expected_results: .github/cnti/expected.yaml
          on_regression: fail
          analyze: true
          analyze_provider: anthropic
          analyze_model: claude-opus-5-5
          analyze_api_key: ${{ secrets.CNTI_ANALYZE_KEY }}
          analyze_comment: true
