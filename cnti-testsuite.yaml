---
# CNTi Test Suite configuration for the eUPF chart in this repository: the
# chart's own defaults, no values file.
config_version: "v2"
common:
  container_names:
    # Retained image tags used by the rolling update, downgrade and rollback
    # tests; the chart's appVersion is the tag under test.
    - name: eupf
      rolling_update_test_tag: "0.7.0"
      rolling_downgrade_test_tag: "0.6.4"
      rolling_version_change_test_tag: "0.7.0"
      rollback_from_tag: "0.7.0"
deployments:
  helm_dirs:
    - name: eupf
      helm_directory: .deploy/helm/eupf
      namespace: eupf-cnti
