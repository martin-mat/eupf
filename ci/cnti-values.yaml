image:
  tag: 0.7.1
args:
- --config
- /app/conf/config.yml
securityContext:
  privileged: true
podSecurityContext:
  sysctls:
  - name: net.ipv4.ip_forward
    value: '1'
configMaps:
  config:
    data:
      config.yml: 'interface_name: eth0

        api_address: :8080

        pfcp_address: :8805

        metrics_address: :9090

        '
env:
  UPF_PFCP_NODE_ID: $(MY_POD_IP)
  UPF_N3_ADDRESS: $(MY_POD_IP)
volumes:
- name: sys
  hostPath:
    path: /sys
- name: config
  configMap:
    name: eupf-config
volumeMounts:
- name: sys
  mountPath: /sys
  readOnly: true
- name: config
  mountPath: /app/conf
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
extraContainerPorts:
- name: metrics
  containerPort: 9090
  protocol: TCP
service:
  type: ClusterIP
  port: 8080
  extraPorts:
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
